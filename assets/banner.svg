<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="V3locity: ball possession, frame by frame">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06281e"/><stop offset="1" stop-color="#0e5a3e"/>
    </linearGradient>
    <pattern id="stripes" width="120" height="420" patternUnits="userSpaceOnUse">
      <rect width="60" height="420" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#7df9c8"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03140f" stop-opacity="0.9"/><stop offset="1" stop-color="#03140f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="reveal"><rect x="60" y="372" height="18" width="0">
      <animate attributeName="width" values="0;1080;1080" keyTimes="0;0.92;1" dur="9s" repeatCount="indefinite"/>
    </rect></clipPath>
    <path id="ballpath" d="M250,265 C320,300 380,310 430,300 S560,240 600,235 S700,300 770,292 S900,230 945,245 S1010,300 900,320 S600,330 430,300 S300,250 250,265"/>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#grass)"/>
  <rect width="1200" height="420" rx="18" fill="url(#stripes)"/>

  <!-- pitch lines -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2">
    <rect x="60" y="150" width="1080" height="210" rx="4"/>
    <line x1="600" y1="150" x2="600" y2="360"/>
    <circle cx="600" cy="255" r="42"/>
    <rect x="60" y="200" width="90" height="110"/><rect x="1050" y="200" width="90" height="110"/>
  </g>

  <!-- players: H (blaugrana) and A (red / white) -->
  <g>
    <circle cx="250" cy="265" r="9" fill="#a50044" stroke="#004d98" stroke-width="4"><animate attributeName="cy" values="265;258;265" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="300" r="9" fill="#a50044" stroke="#004d98" stroke-width="4"><animate attributeName="cx" values="430;440;430" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="228" r="9" fill="#a50044" stroke="#004d98" stroke-width="4"/>
    <circle cx="340" cy="200" r="9" fill="#a50044" stroke="#004d98" stroke-width="4"><animate attributeName="cy" values="200;212;200" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="612" cy="242" r="9" fill="#ee2523" stroke="#ffffff" stroke-width="4"/>
    <circle cx="770" cy="292" r="9" fill="#ee2523" stroke="#ffffff" stroke-width="4"><animate attributeName="cx" values="770;760;770" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="945" cy="245" r="9" fill="#ee2523" stroke="#ffffff" stroke-width="4"><animate attributeName="cy" values="245;236;245" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="190" r="9" fill="#ee2523" stroke="#ffffff" stroke-width="4"><animate attributeName="cy" values="190;204;190" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="320" r="9" fill="#a50044" stroke="#004d98" stroke-width="4"/>
  </g>

  <!-- ball with glow and trail -->
  <use href="#ballpath" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="4 8"/>
  <g>
    <circle r="16" fill="url(#glow)"/>
    <circle r="6.5" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto"><mpath href="#ballpath"/></animateMotion>
  </g>

  <!-- title area -->
  <rect width="1200" height="170" rx="18" fill="url(#fade)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="78" font-size="64" font-weight="800" fill="url(#title)" letter-spacing="2">V3locity
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/></text>
    <text x="600" y="114" font-size="22" fill="#e8fff5" opacity="0">Who has the ball? Ball possession, frame by frame.
      <animate attributeName="opacity" values="0;1" begin="0.6s" dur="1.2s" fill="freeze"/></text>
    <text x="600" y="142" font-size="13" fill="#9fe9c9" letter-spacing="3" opacity="0">MORE THAN A HACK 2027 · PHASE 1 · FC BARCELONA vs ATHLETIC CLUB
      <animate attributeName="opacity" values="0;1" begin="1.2s" dur="1.2s" fill="freeze"/></text>
  </g>

  <!-- possession ribbon: H / A / D, revealed in sync with the ball -->
  <rect x="60" y="372" width="1080" height="18" rx="4" fill="#ffffff" opacity="0.08"/>
  <g clip-path="url(#reveal)">
    <rect x="60"  y="372" width="300" height="18" fill="#a50044"/>
    <rect x="360" y="372" width="70"  height="18" fill="#8a8f98"/>
    <rect x="430" y="372" width="180" height="18" fill="#ee2523"/>
    <rect x="610" y="372" width="320" height="18" fill="#a50044"/>
    <rect x="930" y="372" width="60"  height="18" fill="#8a8f98"/>
    <rect x="990" y="372" width="150" height="18" fill="#ee2523"/>
  </g>
  <line y1="366" y2="396" stroke="#7df9c8" stroke-width="2">
    <animate attributeName="x1" values="60;1140;1140" keyTimes="0;0.92;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="60;1140;1140" keyTimes="0;0.92;1" dur="9s" repeatCount="indefinite"/>
  </line>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#d7f5e8">
    <rect x="60" y="400" width="10" height="10" fill="#a50044"/><text x="76" y="409">H · Barcelona in possession</text>
    <rect x="270" y="400" width="10" height="10" fill="#ee2523"/><text x="286" y="409">A · Athletic in possession</text>
    <rect x="470" y="400" width="10" height="10" fill="#8a8f98"/><text x="486" y="409">D · ball out of play</text>
  </g>
</svg>
